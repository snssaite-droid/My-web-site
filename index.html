<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAN_YU-KI 公式ホームページ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #2ecc71; /* 画面の背景色（緑） */
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    p {
      line-height: 1.8;
      margin-bottom: 30px;
    }
    .youtube-btn {
      display: inline-block;
      background-color: #ff4d94;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.1em;
      box-shadow: 0 4px 10px rgba(255, 77, 148, 0.3);
      transition: background-color 0.3s;
    }
    .youtube-btn:hover {
      background-color: #e6005c;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CHAN_YU-KIのYouTubeチャンネルの<br>公式ホームページです</h1>
    <p>
      遊びに来てくれてありがとうございます！<br>
      チャンネル登録・高評価よろしくお願いします♪
    </p>

    <a href="https://www.youtube.com/@CHAN_YU-KI" class="youtube-btn" target="_blank" rel="noopener noreferrer">YouTubeチャンネルを見る</a>
  </div>

</body>
</html>
