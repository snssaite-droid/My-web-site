<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAN_YU-KI 公式ホームページ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      /* 自然の風景画像（森林）を背景に設定 */
      background-image: url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #2e5a44; /* 画像読み込み前のフォールバック色 */
      color: #000000; /* 文字色（黒） */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      box-sizing: border-box;
    }
    .container {
      /* 背景が透けて見えるように少し透明感のある白に設定 */
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(5px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 600px;
      width: 90%;
      color: #000000;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 20px;
      line-height: 1.4;
      color: #000000;
    }
    .intro-text {
      font-size: 0.95em;
      line-height: 1.8;
      background-color: #f0f7f4; /* 自然に馴染む薄いグリーン系背景 */
      color: #000000;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: left;
      border-left: 5px solid #2e8b57; /* アクセントライン（フォレストグリーン） */
    }
    .videos-section {
      margin-bottom: 30px;
      text-align: left;
    }
    .videos-section h2 {
      font-size: 1.1em;
      margin-bottom: 12px;
      text-align: center;
      color: #000000;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }
    .video-card {
      background: #fafafa;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #eaeaea;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.5%; /* 16:9比率 */
      height: 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .youtube-btn {
      display: inline-block;
      background-color: #ff4d94;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.1em;
      box-shadow: 0 4px 10px rgba(255, 77, 148, 0.3);
      transition: background-color 0.3s;
    }
    .youtube-btn:hover {
      background-color: #e6005c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CHAN_YU-KIのYouTubeチャンネルの<br>公式ホームページです</h1>

    <div class="intro-text">
      2026年4月1日にYouTubeチャンネル設営。<br>
      アウトドア動画、VLOG、釣り、キャンプ、ビートボックス、筋トレ、旅行など幅広いジャンルの動画を更新していきたいと思います！ぜひチャンネル登録をし最新の動画もご覧ください♪
    </div>

    <div class="videos-section">
      <h2>ピックアップ動画</h2>
      <div class="video-grid">
        <!-- 動画1つ目 (srcのVIDEO_IDの箇所にお好みのYouTube動画IDを入れてください) -->
        <div class="video-card">
          <div class="video-wrapper">
            <iframe src="https://youtube.com" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
        <!-- 動画2つ目 -->
        <div class="video-card">
          <div class="video-wrapper">
            <iframe src="https://youtube.com" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>

    <a href="https://youtube.com" class="youtube-btn" target="_blank" rel="noopener noreferrer">YouTubeチャンネルを見る</a>
  </div>
</body>
</html>
